<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#151818">
    <title>CG飞行员 · 加拿大模拟器</title>
    <style>@font-face{font-family:Inter;src:local("Inter");font-display:swap}
:root{color-scheme:dark;--red:#e50539;--green:#28a909;--panel:#1b1c1d;--panel-dark:#141516;--muted:#9b9b9b}
*{box-sizing:border-box}
html,body{min-width:0;min-height:100%;margin:0;background:#0e0e0e;color:#fff;font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html{scrollbar-width:none}html::-webkit-scrollbar{width:0}
button,input{font:inherit}
button{cursor:pointer}
.fg-shell{width:min(760px,100%);min-height:100dvh;margin:auto;overflow:hidden;background:#0e0e0e}
.fg-access[hidden],.fg-game[hidden],.fg-menu[hidden],.fg-toast[hidden]{display:none !important}
.fg-header{height:40px;display:flex;align-items:center;justify-content:space-between;padding:4px 4px 4px 8px;background:#1b1c1d}
.fg-logo{width:72px;height:32px;display:block;overflow:hidden;color:transparent;text-decoration:none;background:url('/assets/pilot/aviator-logo.svg') center/contain no-repeat}
.fg-header>div{height:40px;display:flex;align-items:center;gap:7px}
.fg-header>div b{color:var(--green);font-size:14px;font-variant-numeric:tabular-nums}
.fg-header>div span{color:#9b9c9e;font-size:14px}
.fg-header>div button{width:30px;height:30px;display:grid;place-content:center;gap:3px;padding:0;border:0;background:transparent url('/assets/pilot/burger.svg') center/20px 20px no-repeat}
.fg-header>div button i{display:none}
.fg-history{height:36px;display:flex;align-items:center;gap:16px;overflow:hidden;padding:0 40px 4px 10px;position:relative;white-space:nowrap;background:#0e0e0e}
.fg-history b{color:#16b8e7;font-size:12px;font-weight:400}.fg-history b[data-high="true"]{color:#9138df}.fg-history b[data-jackpot="true"]{color:#e529b7}
.fg-history-empty{color:#858585;font-size:12px}
.fg-history [data-history-more]{position:absolute;border:0;cursor:pointer;right:8px;top:5px;width:29px;height:22px;border-radius:13px;background:#2c2d30 url('/assets/pilot/show-more.svg') center/17px auto no-repeat}
.fg-stage{position:relative;height:calc(100dvh - 496px);min-height:200px;max-height:470px;overflow:hidden;margin:4px;border:1px solid #2a2b2e;border-radius:20px;background:#000}
.fg-rays{position:absolute;left:-150%;top:-50%;z-index:0;width:300%;height:300%;pointer-events:none;background:#000 url('/assets/pilot/bg-sun.svg') center/100% 100% no-repeat}
.fg-stage:before,.fg-stage:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .24s ease}
.fg-stage:before{background:radial-gradient(ellipse 58% 52% at 50% 52%,rgba(13,125,181,.86) 0%,rgba(6,73,111,.48) 45%,transparent 100%);opacity:var(--fg-blue-opacity,0)}
.fg-stage:after{background:radial-gradient(ellipse 58% 52% at 50% 52%,rgba(121,44,190,.95) 0%,rgba(78,27,136,.60) 45%,transparent 100%);opacity:var(--fg-purple-opacity,0)}
.fg-chart{position:absolute;inset:0;z-index:2;width:100%;height:100%}.fg-chart #flightArea{fill:url(#pathFill)}.fg-chart #flightLine{fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round}
.fg-plane{position:absolute;top:0;left:0;z-index:3;width:98px;aspect-ratio:150/74;filter:drop-shadow(0 0 6px rgba(229,5,57,.5));transform:translate(-8px,8px);transform-origin:50% 62%}
.fg-plane img{display:block;width:100%;height:100%;object-fit:contain}
.fg-multiplier{position:absolute;inset:4% 0 0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.fg-multiplier strong{order:2;color:#fff;font-size:clamp(48px,18vw,110px);font-weight:700;line-height:1;letter-spacing:-.045em}.fg-multiplier span{order:1;margin-bottom:16px;color:#fff;font-size:19px;line-height:1.2}
.fg-stage.is-flying .fg-multiplier span{display:none}.fg-stage.is-crashed .fg-multiplier strong{color:var(--red)}.fg-stage.is-waiting .fg-chart{opacity:0}
.fg-players{position:absolute;right:8px;bottom:8px;z-index:5;height:26px;display:flex;align-items:center;padding:3px 9px 3px 5px;border-radius:16px;background:#1b1c1de8}.fg-players .fg-faces{display:flex;align-items:center;height:22px}.fg-avatar{width:22px;height:22px;display:block;overflow:hidden;margin-left:-6px;border:1px solid #55af26;border-radius:50%;background:#252627}.fg-avatar:first-child{margin-left:0}.fg-avatar img{display:block;width:100%;height:100%;object-fit:cover}.fg-players b{margin-left:6px;font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
.fg-countdown{position:absolute;left:50%;top:calc(50% + 26px);z-index:5;width:min(164px,46%);height:4px;overflow:hidden;border-radius:3px;background:#242628;transform:translateX(-50%)}.fg-countdown i{display:block;width:0;height:100%;background:var(--red)}
.fg-panels{display:grid;gap:4px;padding:0 4px}.fg-bet-panel{position:relative;min-height:144px;padding:8px;border-radius:20px;background:#1b1c1d}
.fg-tabs{width:208px;height:32px;display:grid;grid-template-columns:1fr 1fr;margin:0 auto 8px;padding:3px;border-radius:18px;background:#141516}.fg-tabs button{border:0;border-radius:15px;color:#b4b4b4;background:transparent;font-size:12px}.fg-tabs button.is-active,.fg-tabs button[aria-pressed="true"]{color:#fff;background:#2c2d30}
.fg-bet-body{height:88px;display:grid;grid-template-columns:minmax(110px,140px) minmax(120px,218px);justify-content:center;gap:7px}.fg-stake{display:grid;align-content:start}.fg-stake>div:first-child{height:32px;display:grid;grid-template-columns:24px minmax(0,1fr) 24px;align-items:center;padding:4px;border-radius:18px;background:var(--panel-dark)}.fg-stake button{border:0;color:#aaa;background:#2c2d30}.fg-stake>div:first-child button{width:24px;height:24px;justify-self:center;padding:0;overflow:hidden;border-radius:50%;color:transparent;background-position:center;background-size:14px;background-repeat:no-repeat;font-size:0}.fg-stake [data-step="-1"]{background-image:url('/assets/pilot/minus-grey.svg')}.fg-stake [data-step="1"]{background-image:url('/assets/pilot/plus-grey.svg')}.fg-stake input{width:100%;min-width:0;height:24px;padding:0;border:0;border-radius:18px;outline:0;color:#ccc;background:transparent;text-align:center;font-size:16px;font-weight:600}.fg-quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin-top:4px}.fg-quick button{height:24px;padding:0;border:0;border-radius:14px;background:#141516;color:#83878e;font-size:14px}
.fg-action{height:80px;width:calc(100% - 8px);justify-self:center;align-self:center;display:flex;flex-wrap:wrap;align-content:center;align-items:baseline;justify-content:center;padding:8px;border:1px solid #b2f2a3;border-radius:12px;color:#fafafa;background:#28a909}.fg-action span{flex:0 0 100%;font-size:22px;line-height:27px}.fg-action strong{font-size:22px;font-weight:400;line-height:27px}.fg-action small{margin-left:4px;font-size:18px;line-height:27px}.fg-action.is-queued{border-color:#f2cf79;background:#d39a10}.fg-action.is-cashout{border-color:#f5d58c;background:#d99c0b}.fg-action:disabled{opacity:.5}
.fg-ledger{margin:4px;padding:8px 8px 12px;border-radius:20px;background:#1b1c1d}.fg-ledger nav{width:min(396px,100%);height:32px;display:grid;grid-template-columns:repeat(3,1fr);margin-inline:auto;padding:3px;border-radius:18px;background:#141516}.fg-ledger nav button{height:24px;border:0;border-radius:15px;color:#aaa;background:transparent;font-size:12px}.fg-ledger nav button.is-active{color:#fff;background:#2c2d30}
.fg-total{height:68px;position:relative;margin-top:6px;padding:8px 10px;border-radius:15px;background:#141516}.fg-total>div{display:flex;position:absolute;left:10px;top:8px}.fg-total>strong{position:absolute;right:10px;top:8px;font-size:18px}.fg-total>span{position:absolute;left:10px;top:35px;color:#b5b5b5;font-size:11px}.fg-total>small{position:absolute;right:10px;top:37px;color:#777;font-size:10px}.fg-total>i{position:absolute;left:10px;right:10px;bottom:7px;height:5px;overflow:hidden;border-radius:4px;background:#242628}.fg-total>i b{display:block;width:0;height:100%;border-radius:inherit;background:#4d9d0a}
.fg-ledger #ledger{margin-top:7px}.fg-ledger p{margin:0;color:#888;font-size:11px;line-height:1.5}.fg-ledger-head,.fg-ledger article{min-height:36px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(58px,.85fr) minmax(44px,.55fr) minmax(64px,.9fr);align-items:center;gap:5px;padding:4px 2px;border-bottom:1px solid #272829;font-size:11px}.fg-ledger article span{min-width:0;color:#aaa;text-align:right;font-variant-numeric:tabular-nums}.fg-ledger-head{min-height:24px;color:#777;text-align:right;font-size:10px}.fg-ledger-head span:first-child{text-align:left}.fg-ledger .fg-player-name{display:flex;align-items:center;gap:5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fg-player-name img{width:24px;height:24px;flex:none;border-radius:50%;object-fit:cover}.fg-ledger article .is-paid{color:#55bd24}.fg-ledger .fg-ledger-note{padding-top:10px}
.fg-menu{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:flex-end;padding:36px 4px 8px}.fg-menu-backdrop{position:absolute;inset:0;border:0;background:transparent}.fg-menu section{position:relative;width:min(320px,100%);max-height:calc(100dvh - 44px);overflow-y:auto;padding-bottom:max(8px,env(safe-area-inset-bottom));border-radius:4px;background:#1b1c1d;box-shadow:0 4px 14px #0006}.fg-menu header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#2c2d30}.fg-menu header strong{color:#fff;font-size:16px}.fg-menu header button{width:34px;height:34px;border:0;color:#bbb;background:transparent;font-size:22px}.fg-menu section>button,.fg-menu section>a{width:100%;min-height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border:0;border-bottom:1px solid #303132;color:#fff;background:transparent;text-decoration:none;font-size:14px}.fg-menu section small{display:block;margin:12px 14px 4px;color:#a3a3a3;font-size:11px;line-height:1.5}
.fg-setting-switch{position:relative;display:inline-block;min-width:52px;height:24px;border-radius:12px;color:#fff;background:#3a3d40;font-size:12px;line-height:24px;text-align:center;padding:0 10px;box-sizing:border-box;transition:background .15s}.fg-setting-switch:after{display:none}.fg-menu [aria-pressed="true"] .fg-setting-switch{background:#2f9e44;color:#fff}.fg-menu [aria-pressed="false"] .fg-setting-switch{background:#4a4d50;color:#cfd2d4}
.fg-toast{position:fixed;left:50%;bottom:78px;z-index:30;max-width:calc(100% - 28px);padding:9px 14px;border-radius:8px;color:#fff;background:#303234ee;transform:translateX(-50%);font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.fg-mask{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(8,8,12,.72)}
.fg-mask.show{display:flex}
.fg-mask .box{width:78%;max-width:280px;background:#1c1d24;border-radius:14px;padding:22px 16px;text-align:center}
.fg-mask h3{margin:0 0 8px}
.fg-mask p{color:#aaa;font-size:14px}
@media (max-width:360px){.fg-stage{height:calc(100dvh - 482px);min-height:180px}.fg-bet-panel{min-height:134px;padding-top:6px}.fg-bet-body{height:78px;grid-template-columns:130px minmax(0,184px);gap:4px}.fg-action{height:76px}.fg-panels{gap:3px}.fg-ledger{margin-top:3px}}
@media (min-width:541px){.fg-shell{padding-bottom:16px}.fg-header{height:50px}.fg-history{height:40px}.fg-stage{height:min(58vh,520px);min-height:360px;margin:7px}.fg-panels{grid-template-columns:1fr 1fr;padding:0 7px;gap:7px}.fg-bet-panel{min-height:154px}.fg-ledger{margin:7px}.fg-plane{width:130px}}
.fg-auto-settings[hidden]{display:none}
[data-panel-fold]{position:absolute;right:max(8px,calc((100% - 360px)/2));top:10px;display:grid;place-items:center;width:28px;height:28px;padding:2px;border:0;border-radius:50%;background:#292b2d;color:#aaa}
[data-panel-fold] svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;pointer-events:none}
[data-panel-fold] .fg-fold-plus{display:none}
.fg-bet-panel.is-collapsed{min-height:52px;align-self:start}
.fg-bet-panel.is-collapsed .fg-bet-body,.fg-bet-panel.is-collapsed .fg-auto-settings{display:none}
.fg-bet-panel.is-collapsed .fg-fold-plus{display:block}
.fg-ledger article.fg-own-bet{background:#20341c;border-radius:6px;padding-inline:6px}
.fg-auto-settings{display:flex;align-items:center;justify-content:flex-end;gap:5px;width:min(360px,100%);height:32px;margin:8px auto 0;padding-top:8px;border-top:1px solid #303234}
.fg-auto-settings label{display:flex;align-items:center;gap:6px;font-size:12px;color:#ccc;white-space:nowrap}
.fg-auto-settings label:first-child{margin-right:auto;margin-left:5px}
.fg-auto-settings input[type=checkbox]{appearance:none;-webkit-appearance:none;width:34px;height:24px;margin:0;border:0;border-radius:16px;background:#141516;position:relative;cursor:pointer;flex:none}
.fg-auto-settings input[type=checkbox]:after{content:"";position:absolute;left:3px;top:4px;width:16px;height:16px;border-radius:50%;background:#343638;transition:transform .15s}
.fg-auto-settings input[type=checkbox]:checked{background:#28a909}
.fg-auto-settings input[type=checkbox]:checked:after{background:white;transform:translateX(11px)}
.fg-cash-input{height:24px;width:80px;gap:2px;background:#141516;border-radius:12px;padding:0 6px}
.fg-cash-input input{min-width:0;width:100%;height:100%;border:0;background:transparent;color:white;text-align:center;font-size:12px}
.fg-bet-panel input:disabled,.fg-bet-panel button:disabled{opacity:.5;cursor:not-allowed}
.fg-stage:not(.is-waiting) .fg-countdown{display:none}
.fg-history.is-expanded{height:auto;min-height:36px;flex-wrap:wrap;padding-block:8px;gap:8px 16px}
@media (max-width:360px){.fg-auto-settings{gap:8px}.fg-auto-settings label{font-size:10px}.fg-cash-input{width:58px}}
@media (prefers-reduced-motion:reduce){.fg-stage:before,.fg-stage:after,.fg-auto-settings input:after{transition:none}}
</style>
</head>
<body>
<main class="fg-shell" id="flightApp">
    <div class="fg-game" id="gameContent">
        <header class="fg-header">
            <a class="fg-logo" href="/" aria-label="Aviator">Aviator</a>
            <div>
                <b id="balance">100000.92</b>
                <span>CNY</span>
                <button id="menuToggle" type="button" aria-expanded="false" aria-controls="gameMenu" aria-label="打开游戏菜单"><i></i><i></i><i></i></button>
            </div>
        </header>
        <section class="fg-history" id="history" aria-label="历史倍数"></section>
        <section class="fg-stage is-waiting" id="stage" aria-label="CG飞行员回合">
            <div class="fg-rays" aria-hidden="true"></div>
            <svg class="fg-chart" viewBox="0 0 600 400" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                    <linearGradient id="pathFill" x1="0" y1="1" x2="0" y2="0">
                        <stop stop-color="#8a001f" stop-opacity=".62"></stop>
                        <stop offset="1" stop-color="#e50539" stop-opacity=".7"></stop>
                    </linearGradient>
                </defs>
                <path id="flightArea" d="M 4 392 L 4 400 Z"></path>
                <path id="flightLine" d="M 4 392"></path>
            </svg>
            <div class="fg-plane" id="plane" aria-hidden="true">
                <img id="planeFrame" src="/assets/pilot/plane-0.svg" alt="" width="150" height="74">
            </div>
            <div class="fg-multiplier">
                <span id="roundState">等待下一局</span>
                <strong id="multiplier"></strong>
            </div>
            <div class="fg-players" aria-label="在线人数">
                <span class="fg-faces" id="stageFaces"></span>
                <b id="viewerCount">0</b>
            </div>
            <div class="fg-countdown"><i id="countdownBar"></i></div>
        </section>
        <section class="fg-panels" id="betPanels">
                        <article class="fg-bet-panel" data-panel="1">
                                <div class="fg-tabs">
                    <button class="is-active" data-manual type="button" aria-pressed="true">投注</button>
                    <button data-auto type="button" aria-pressed="false">自动</button>
                </div>
                <div class="fg-bet-body">
                    <div class="fg-stake">
                        <div>
                            <button data-step="-1" type="button" aria-label="减少">−</button>
                            <input data-stake value="1.00" inputmode="decimal" aria-label="第1组投注金额">
                            <button data-step="1" type="button" aria-label="增加">＋</button>
                        </div>
                        <div class="fg-quick">
                            <button type="button" data-value="10">10</button>
                            <button type="button" data-value="20">20</button>
                            <button type="button" data-value="50">50</button>
                            <button type="button" data-value="100">100</button>
                        </div>
                    </div>
                    <button class="fg-action" data-action type="button" data-intent="queued"><span>投注</span><strong>1.00</strong><small>CNY</small></button>
                </div>
                <div class="fg-auto-settings" data-auto-settings hidden>
                    <label><span>自动下注</span><input data-auto-enable type="checkbox" role="switch"></label>
                    <label><span>自动兑现</span><input data-auto-cash type="checkbox" role="switch"></label>
                    <label class="fg-cash-input"><input data-cash-at value="1.10" inputmode="decimal" disabled><span>x</span></label>
                </div>
            </article>
                        <article class="fg-bet-panel" data-panel="2">
                                <button type="button" data-panel-fold aria-expanded="true" aria-label="展开或收起第二组下注面板">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"></rect><path d="M8 12h8"></path><path class="fg-fold-plus" d="M12 8v8"></path></svg>
                </button>
                                <div class="fg-tabs">
                    <button class="is-active" data-manual type="button" aria-pressed="true">投注</button>
                    <button data-auto type="button" aria-pressed="false">自动</button>
                </div>
                <div class="fg-bet-body">
                    <div class="fg-stake">
                        <div>
                            <button data-step="-1" type="button" aria-label="减少">−</button>
                            <input data-stake value="1.00" inputmode="decimal" aria-label="第2组投注金额">
                            <button data-step="1" type="button" aria-label="增加">＋</button>
                        </div>
                        <div class="fg-quick">
                            <button type="button" data-value="10">10</button>
                            <button type="button" data-value="20">20</button>
                            <button type="button" data-value="50">50</button>
                            <button type="button" data-value="100">100</button>
                        </div>
                    </div>
                    <button class="fg-action" data-action type="button" data-intent="queued"><span>投注</span><strong>1.00</strong><small>CNY</small></button>
                </div>
                <div class="fg-auto-settings" data-auto-settings hidden>
                    <label><span>自动下注</span><input data-auto-enable type="checkbox" role="switch"></label>
                    <label><span>自动兑现</span><input data-auto-cash type="checkbox" role="switch"></label>
                    <label class="fg-cash-input"><input data-cash-at value="1.10" inputmode="decimal" disabled><span>x</span></label>
                </div>
            </article>
                    </section>
        <section class="fg-ledger">
            <nav aria-label="游戏记录">
                <button class="is-active" data-ledger="all" aria-pressed="true">所有投注</button>
                <button data-ledger="prev" aria-pressed="false">上一回合</button>
                <button data-ledger="top" aria-pressed="false">最高</button>
            </nav>
            <div class="fg-total">
                <div id="ledgerFaces"></div>
                <strong id="totalWin">0.00</strong>
                <span><b id="betProgress">0/0</b> 已兑现 / 下注</span>
                <small>总赢奖 CNY</small>
                <i><b id="betProgressBar"></b></i>
            </div>
            <div id="ledger"></div>
        </section>
    </div>
</main>
<div class="fg-menu" id="gameMenu" hidden>
    <button class="fg-menu-backdrop" type="button" data-menu-close aria-label="关闭菜单"></button>
    <section role="dialog" aria-modal="true" aria-label="游戏菜单">
        <header><strong>CG飞行员</strong><button data-menu-close type="button" aria-label="关闭">×</button></header>
        <button id="soundToggle" type="button" aria-pressed="true">声音 <span class="fg-setting-switch">开启</span></button>
        <button id="musicToggle" type="button" aria-pressed="true">音乐 <span class="fg-setting-switch">开启</span></button>
        <button id="animationToggle" type="button" aria-pressed="true">动画 <span class="fg-setting-switch">开启</span></button>
        <a href="/">返回游戏大厅</a>
        <small>飞机起飞后倍率上升，飞走前点「收取」按当前倍率结算。等待阶段可下注或取消。</small>
    </section>
</div>
<div class="fg-toast" id="toast" hidden role="status"></div>
<div class="fg-mask" id="pilotMask">
